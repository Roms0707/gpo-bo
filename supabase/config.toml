port = 54323
# API URL for Studio
api_url = "http://localhost"

# ═══════════════════════════════════════════════════════════════════════════
# AUTH SETTINGS
# ═══════════════════════════════════════════════════════════════════════════

[auth]
# Port for auth service (local)
port = 54324
# Site URL - adjust for your environment
site_url = "http://localhost:5173"
# Additional redirect URLs
additional_redirect_urls = ["https://localhost:5173"]
# JWT expiry
jwt_expiry = 3600
# Enable signup
enable_signup = true

